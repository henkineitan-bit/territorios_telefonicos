<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Territorios{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>Gestión de Territorios</h1>
        <nav>
            <a href="{{ url_for('index') }}">Territorios</a>
            <a href="{{ url_for('responsables') }}">Responsables</a>
            <a href="{{ url_for('importar_excel_view') }}">Importar Excel</a>
            <a href="{{ url_for('importar_historial_view') }}">Importar Historial</a>
            <a href="{{ url_for('exportar_excel') }}">Exportar Excel</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Proyecto Flask &mdash; en construcción</p>
    </footer>

</body>
</html>
